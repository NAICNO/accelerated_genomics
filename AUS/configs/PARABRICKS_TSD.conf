/*
 * -------------------------------------------------
 * Nextflow config file for Clara Parabricks (GPU) pipelines
 * -------------------------------------------------
 * Config for the TSD Colossus cluster (Sensitive Data Services)
 * https://www.uio.no/english/services/it/research/sensitive-data/
 *
 * Adapted from the CPU-only TSD.config pattern for GPU-accelerated
 * NVIDIA Clara Parabricks (pbrun) tools.
 *
 * Shared executor/GPU/Apptainer config for BOTH pipelines below -- included
 * via the `tsd` profile in somatic.config and germline.config respectively.
 *
 * Somatic workflow (somatic_main.nf):
 *
 * [Tumor FASTQ]  --> fq2bam --> [Tumor BAM]  --+
 *                                               +--> mutectcaller --> postpon --> [Mutect2 VCF]
 * [Normal FASTQ] --> fq2bam --> [Normal BAM] --+                  |          --> vcfqc
 *                                               |
 *                                               +--> prepon  (panel-of-normals / contamination prep, feeds postpon)
 *                                               +--> deepsomatic --------------> [DeepSomatic VCF]
 *
 * Germline workflow (germline_workflow.nf):
 *
 * [Sample FASTQ] --> fq2bam --> [BAM] --> bqsr --> applybqsr --> [Recal BAM] --+--> deepvariant     --> vcfqc
 *                                                                              +--> haplotypecaller --> vcfqc
 *
 * bqsr / applybqsr run between fq2bam and the callers (recal table
 * generation + application) even though the somatic diagram above
 * omits them; they're shared, unmodified between both workflows.
 *
 * BEFORE FIRST RUN, VERIFY AGAINST CURRENT TSD DOCS/MODULES:
 *   - Apptainer/Singularity module name & version, or whether it`s
 *     preinstalled on compute nodes with no module load needed
 *   - GPU partition name and --gres/--gpus syntax for Colossus (accel partition)
 *   - Bind-mount paths (-B) match current storage layout
 *   - GPU count/memory per process against actual input size and
 *     current NVIDIA Parabricks sizing guidance for the H200 / RTX Pro 6000
 *     GPUs on Colossus
 *
 * Container engine (Apptainer/Singularity) is enabled via the separate
 * `singularity` profile / configs/singularity.conf -- this file is meant
 * to be combined with it: -profile singularity,tsd. Only cluster-specific
 * container settings (bind mounts, image cache path) live here.
 *
 * GPU processes below assume the pipeline`s process definitions
 * (fq2bam.nf, bqsr.nf, applybqsr.nf, somatic_mutectcaller.nf,
 * somatic_deepsomatic.nf, germline_deepvariant.nf, germline_haplotypecaller.nf)
 * carry `label 'gpu_process'`, same pattern as leaf_process /
 * research_process in TSD.config.
 */

// NOTE: containerPath lives inside params {} (a config statement), not as
// a bare `def` variable -- this file is spliced into somatic.config /
// germline.config via includeConfig (inside profiles { tsd { ... } })

params {
  // set up default params
  containerPath = "file:///cluster/p/pXX/cluster/NGS/images"  // Path to Apptainer/Singularity images -- update pXX per project
}

// Engine enable/autoMounts comes from the `singularity` profile
// (configs/singularity.conf); this block only adds the TSD-specific
// image cache location. Additive merge with singularity.conf, so profile
// order on the command line (singularity,tsd vs tsd,singularity) doesn`t matter.
singularity {
  cacheDir = params.containerPath
}

process {
  executor = 'slurm'

  // -B /cluster,/gpfs matches TSD`s storage layout
  //  --nv exposes GPU/CUDA libraries inside the container
  //       harmless for CPU-only containers too
  containerOptions = "-B /tsd,/gpfs --nv"

  /* On TSD, specify --mem-per-cpu instead of --mem
   * However, Nextflow`s SLURM executor adds native `--mem` unconditionally
   * whenever `memory` is set ANYWHERE in the merged config
   * Therefore, `memory` directive is set via `ext.mem_gb` in resource-sizing profiles.
   * Following closure calculates the appropriate `--mem-per-cpu` value based on `task.ext.mem_gb` and `task.cpus`.
   */
  clusterOptions = { "--account=pXX --mem-per-cpu=${(task.ext.mem_gb * 1024 / task.cpus as int)}M" }

  // Verify whether a module load is still needed on the current Colossus system
  beforeScript = "module purge \
&& set -o errexit"

  errorStrategy = 'retry'
  maxRetries = 1

  /* NOTE: no default cpus/time/memory directives -- those come from
   * resource-sizing profile - e.g., `production` or `test`
   * Selecting one of the resource-sizing profiles is mandatory
   *    fail fast if neither is present 
   */

  withLabel: leaf_process {
    /* Leaf processes: produce outputs that are not used by downstream processes
     * These processes do not affect the overall pipeline completion -
     *   not critical for pipeline completion.
     * Retry once, then ignore on second failure.
     */
    errorStrategy = { task.attempt == 1 ? 'retry' : 'ignore' }
  }

  withLabel: gpu_process {
    /* Shared settings for GPU-accelerated pbrun tools.
     * Refer current TSD Slurm GPU documentation to verify settings.
     * * --mem-per-cpu derived from task.ext.mem_gb as specified before
     */
    clusterOptions = { "--account=pXX --partition=accel --gpus=1 --mem-per-cpu=${(task.ext.mem_gb * 1024 / task.cpus as int)}M" }
    accelerator    = 1
  }

  // ---- vcfqc: label assignment only ----
  // `label` is process identity, not cluster config or workload sizing, but
  // it has to live somewhere always-loaded regardless of profile combo
  withName:VCFQC {
    label = 'leaf_process'
  }
}
