/*
 * -------------------------------------------------
 * Exome (WES) resource sizing (shared by fox and tsd)
 * -------------------------------------------------
 * Per-process cpus/time/ext.mem_gb ONLY -- no executor, account, queue,
 * GPU request syntax, or container settings. Those stay cluster-specific
 * in configs/PARABRICKS_FOX.conf / configs/PARABRICKS_TSD.conf, exactly
 * like configs/resources_production.conf / configs/resources_test.conf.
 *
 * `production`, `test`, and `exome` are a THREE-WAY mutually-exclusive
 * choice -- a run selects exactly one of them alongside `singularity` +
 * (`tsd`/`fox`), e.g. -profile singularity,tsd,exome. This is additive to
 * the profile set, not a replacement: `production`/`test` are unchanged.
 * Profile `exome` is a THIRD resource-sizing profile rather than 
 * a fourth one layered on top of `production`/`test` -- 
 * profile merging is whole-map REPLACE (not merge)
 * when two profiles set the same directive on the same `withName`
 * selector, so `-profile singularity,tsd,production,exome` would silently
 * let whichever profile is listed last win per-directive, not combine
 * them. Never combine `exome` with `production` or `test` on the same
 * run.
 *
 */

params {
  // Marker asserted by the workflow entrypoints to confirm a resource
  // profile was actually selected (production XOR test XOR exome) --
  // Nextflow does not fail on its own just because a `production`/`test`/
  // `exome` profile was left off the command line.
  _resource_profile = 'exome'
}

process {
  // ---- fallback for any process without a more specific withName block ----
  cpus = 32
  time = 2.h
  ext  = [ mem_gb: 60 ]

  // ---- fq2bam: GPU alignment, sorting, duplicate marking (tumor + normal / sample) ----
  // NOT reduced from production: fq2bam deliberately never gets --interval-file
  // -- alignment stays whole-genome for exome samples too, so its
  // resource needs are identical to a WGS run.
  withName:FQ2BAM {
    cpus = 16
    time = 6.h
    ext  = [ mem_gb: 64 ]
  }

  // ---- giraffe: GPU pangenome-graph alignment, sorting, duplicate marking ----
  // (germline only, --germline_mapping giraffe). Memory is NOT copied from the fq2bam block.
  withName:GIRAFFE {
    cpus = 16
    time = 6.h
    ext  = [ mem_gb: 64 ]
  }

  // ---- bqsr: GPU base quality score recalibration table generation ----
  withName:BQSR {
    cpus = 8
    time = 1.h
    ext  = [ mem_gb: 24 ]
  }

  // ---- applybqsr: GPU application of the recalibration table ----
  withName:APPLYBQSR {
    cpus = 8
    time = 1.h
    ext  = [ mem_gb: 24 ]
  }

  // ---- prepon: CPU pre-processing ahead of variant calling ----
  // (panel-of-normals / contamination pileup prep feeding mutectcaller)
  withName:PREPON {
    cpus = 4
    time = 45.m
    ext  = [ mem_gb: 12 ]
  }

  withName:MUTECTCALLER {
    cpus = 16
    time = 2.h
    ext  = [ mem_gb: 40 ]
  }

  // ---- postpon: CPU post-calling filtering (e.g. panel-of-normals / FilterMutectCalls) ----
  withName:POSTPON {
    cpus = 4
    time = 1.h
    ext  = [ mem_gb: 12 ]
  }

  withName:DEEPSOMATIC {
    cpus = 16
    time = 2.h
    ext  = [ mem_gb: 40 ]
  }

  // ---- deepvariant: GPU deep-learning germline variant caller ----
  withName:DEEPVARIANT {
    cpus = 16
    time = 2.h
    ext  = [ mem_gb: 40 ]
  }

  // ---- haplotypecaller: GPU germline variant calling (GATK HaplotypeCaller) ----
  withName:HAPLOTYPECALLER {
    cpus = 16
    time = 2.h
    ext  = [ mem_gb: 40 ]
  }

  // ---- vcfqc: CPU QC on the resulting VCF(s) ----
  withName:VCFQC {
    cpus = 2
    time = 30.m
    ext  = [ mem_gb: 8 ]
  }
}
