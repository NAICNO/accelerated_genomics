/*
 * -------------------------------------------------
 * Test resource sizing (shared by fox and tsd)
 * -------------------------------------------------
 * Per-process cpus/time/memory ONLY, sized for the small test dataset --
 * no executor, account, queue, GPU request syntax, or container
 * settings. Those stay cluster-specific in configs/PARABRICKS_FOX.conf /
 * configs/PARABRICKS_TSD.conf.
 *
 * Included via the `test` profile in somatic.config /
 * germline.config. `production` and `test` (configs/resources_test.conf)
 * are mutually-exclusive-by-convention resource-sizing profiles -- a run
 * must include exactly one of them alongside `singularity` + (`tsd`/`fox`),
 * e.g. -profile singularity,tsd,production. Neither profile is optional -
 * the workflow entrypoints (germline_workflow.nf / somatic_main.nf) fail
 * fast if neither is selected -- see the `_resource_profile` params flag
 * set below.
 *
 */

params {
  // Marker asserted by the workflow entrypoints to confirm a resource
  // profile was actually selected (production XOR test) -- Nextflow
  // does not fail on its own just because a `production`/`test` profile
  // was left off the command line.
  _resource_profile = 'test'
}

process {
  // ---- fallback for any process without a more specific withName block ----
  cpus   = 32
  time   = 20.m
  memory = 120.GB

  // ---- fq2bam: GPU alignment, sorting, duplicate marking (tumor + normal / sample) ----
  withName:FQ2BAM {
    cpus   = 16
    time   = 20.m
    memory = 64.GB
  }

  // ---- bqsr: GPU base quality score recalibration table generation ----
  withName:BQSR {
    cpus   = 8
    time   = 20.m
    memory = 32.GB
  }

  // ---- applybqsr: GPU application of the recalibration table ----
  withName:APPLYBQSR {
    cpus   = 8
    time   = 20.m
    memory = 32.GB
  }

  // ---- prepon: CPU pre-processing ahead of variant calling ----
  // (panel-of-normals / contamination pileup prep feeding mutectcaller)
  withName:PREPON {
    cpus   = 4
    time   = 20.m
    memory = 16.GB
  }

  // ---- mutectcaller: GPU somatic variant calling (tumor/normal) ----
  withName:MUTECTCALLER {
    cpus   = 16
    time   = 20.m
    memory = 64.GB
  }

  // ---- postpon: CPU post-calling filtering (e.g. panel-of-normals / FilterMutectCalls) ----
  withName:POSTPON {
    cpus   = 4
    time   = 20.m
    memory = 16.GB
  }

  // ---- deepsomatic: GPU deep-learning somatic variant caller ----
  withName:DEEPSOMATIC {
    cpus   = 16
    time   = 20.m
    memory = 64.GB
  }

  // ---- deepvariant: GPU deep-learning germline variant caller ----
  withName:DEEPVARIANT {
    cpus   = 16
    time   = 20.m
    memory = 64.GB
  }

  // ---- haplotypecaller: GPU germline variant calling (GATK HaplotypeCaller) ----
  withName:HAPLOTYPECALLER {
    cpus   = 16
    time   = 20.m
    memory = 64.GB
  }

  // ---- vcfqc: CPU QC on the resulting VCF(s) ----
  withName:VCFQC {
    cpus   = 2
    time   = 20.m
    memory = 8.GB
  }
}
