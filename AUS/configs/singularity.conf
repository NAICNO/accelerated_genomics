/*
 * -------------------------------------------------
 * Shared container-engine config (Apptainer/Singularity)
 * -------------------------------------------------
 * Turns on the Singularity container engine for BOTH the somatic
 * (somatic_main.nf / somatic.config) and germline (germline_workflow.nf /
 * germline.config) Parabricks pipelines.
 *
 * This file is included via the `singularity` profile and is meant to be
 * combined with a cluster profile (`tsd` or `fox`) on the command line:
 *
 *   nextflow run somatic_main.nf      -c somatic.config   -profile singularity,tsd
 *   nextflow run somatic_main.nf      -c somatic.config   -profile singularity,fox
 *   nextflow run germline_workflow.nf -c germline.config  -profile singularity,tsd
 *   nextflow run germline_workflow.nf -c germline.config  -profile singularity,fox
 *
 * Cluster-specific bits stay OUT of this file and remain in
 * configs/PARABRICKS_TSD.conf / configs/PARABRICKS_FOX.conf:
 *   - bind mounts / --nv               -> process.containerOptions
 *   - image cache location             -> singularity.cacheDir (set from
 *                                          each cluster's params.containerPath)
 *   - executor, account, GPU/CPU sizing -> process {} / executor {}
 * This file only enables the engine and turns on auto bind-mounting of
 * the host's standard paths (home dir, cwd, etc); everything else is
 * additive from the cluster conf, so include order on the command line
 * does not matter.
 *
 * NOTE: Apptainer (the engine TSD `apptainer` module provides) ships a
 * `singularity`-compatible command shim on most current HPC installs,
 * so Nextflow `singularity {}` scope below drives Apptainer there too,
 * even though the underlying TSD binary/module is named `apptainer`.
 * VERIFY THIS before the first TSD run: if the TSD compute nodes only
 * expose a plain `apptainer` binary with no `singularity` alias on PATH,
 * switch this block to `apptainer { ... }` instead -- the option names
 * (enabled / autoMounts / cacheDir) are identical either way, so the rest
 * of this file and PARABRICKS_TSD.conf need no other changes.
 */

singularity {
  enabled    = true
  autoMounts = true
}
