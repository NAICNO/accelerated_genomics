/*
 * -------------------------------------------------
 * Nextflow config file for Clara Parabricks (GPU) pipelines
 * -------------------------------------------------
 * Config for the Fox HPC cluster (Educloud Research, NON-sensitive data)
 * https://www.uio.no/english/services/it/research/hpc/fox/
 *
 * Mirrors configs/PARABRICKS_TSD.conf (same shared executor/GPU/container
 * pattern, same withName/withLabel blocks) but adapted for Fox instead of
 * TSD/Colossus: Singularity instead of Apptainer, Fox `--gpus=<type>:<n>`
 * GPU syntax instead of TSD's `--gres=gpu:<n>`, and Fox's `normal`/`accel`
 * partitions. Based on the SLURM executor header used in earlier Nextflow
 * runs on Fox (executor block, account, containerOptions), extended with
 * the GPU/label blocks the pbrun modules in this repo expect.
 *
 * Shared executor/GPU/Singularity config for BOTH pipelines below --
 * included via the `fox` profile in somatic.config and germline.config.
 *
 * Container engine (Apptainer/Singularity) is enabled via the separate
 * `singularity` profile / configs/singularity.conf -- this file is meant
 * to be combined with it: -profile singularity,fox. Only cluster-specific
 * container settings (bind mounts, image cache path) live here.
 *
 * Somatic workflow (somatic_main.nf):
 *
 * [Tumor FASTQ]  --> fq2bam --> [Tumor BAM]  --+
 *                                               +--> mutectcaller --> postpon --> [Mutect2 VCF]
 * [Normal FASTQ] --> fq2bam --> [Normal BAM] --+                  |          --> vcfqc
 *                                               |
 *                                               +--> prepon  (panel-of-normals / contamination prep, feeds postpon)
 *                                               +--> deepsomatic --------------> [DeepSomatic VCF]
 *
 * Germline workflow (germline_workflow.nf):
 *
 * [Sample FASTQ] --> fq2bam --> [BAM] --> bqsr --> applybqsr --> [Recal BAM] --+--> deepvariant     --> vcfqc
 *                                                                              +--> haplotypecaller --> vcfqc
 *
 * bqsr / applybqsr run between fq2bam and the callers (recal table
 * generation + application) even though the somatic diagram above omits
 * them; they are shared, unmodified between both workflows.
 *
 * BEFORE FIRST RUN, VERIFY / ADJUST:
 *   - GPU availability on Fox is small: 3x A100 (accel, hudel partitions)
 *     and 3x RTX3090 (ifi_accel, accel partitions) cluster-wide --
 *     https://www.uio.no/english/services/it/research/platforms/edu-research/help/fox/GPUs/selecting-gpus.md
 *     Below we request a generic `--gpus=1` (any available type) rather
 *     than pinning to `a100:1` or `rtx30:1`, so jobs arent stuck queueing
 *     behind one specific GPU type while testing. Pin a type once you know
 *     which one you need (e.g. for reproducible timing/benchmarking).
 *   - Job types/partitions -- `normal` (default, up to 5 days), `accel`
 *     (GPU, up to 7 days), `devel` (fast-turnaround testing, <=2h, can be
 *     combined with --partition=accel for a quick GPU smoke test) --
 *     https://www.uio.no/english/services/it/research/platforms/edu-research/help/fox/jobs/job-types.md
 *     Consider running a single small step with `--partition=devel` first
 *     to confirm containers/GPU access work before committing to full-size
 *     resource requests below.
 *   - Confirm `ec232` is still the right account/project to bill against.
 *   - Singularity image directory below assumes .sif images already exist
 *     under ~/singularity_images -- adjust `singularityDir` or build/pull
 *     the images there first. Confirm whether Singularity/Apptainer needs
 *     an explicit `module load` on current Fox login/compute nodes, or is
 *     preinstalled (unlike PARABRICKS_TSD.conf, no `beforeScript` module
 *     load is set here -- add one back if Fox requires it).
 *   - `-B /localscratch` bind mount matches Fox's ' local scratch
 *     convention from the original job header -- confirm it still matches
 *     your storage layout / job size (Fox docs: job-types.md above).
 *   - Resource sizes (cpus/time/memory) per process below are carried over
 *     from configs/PARABRICKS_TSD.conf already-tuned values, with memory
 *     added as a starting-point estimate (Fox uses `--mem`, not TSD
 *     `--mem-per-cpu`) -- not yet benchmarked on Fox hardware, tune after
 *     your first test runs.
 *
 * GPU processes below assume the pipelines process definitions
 * (fq2bam.nf, bqsr.nf, applybqsr.nf, somatic_mutectcaller.nf,
 * somatic_deepsomatic.nf, germline_deepvariant.nf, germline_haplotypecaller.nf)
 * carry `label 'gpu_process'` and read `task.accelerator.request` for
 * `--num-gpus`, same pattern as PARABRICKS_TSD.conf.
 */

// ---- shared variables ----
// NOTE: these used to be plain `def` variables, but once this file is
// spliced into somatic.config/germline.config via includeConfig (inside
// profiles { fox { ... } }), any config statement (manifest{}, params{})
// appearing earlier in the combined parse makes a later `def` illegal --
// Nextflow errors with "Variable declarations cannot be mixed with config statements".
// Using params.* instead keeps everything as config
// statements throughout, so its safe regardless of include order.

params {
  // set up default params
  singularityDir = "/projects/ec232/ngs/ngs_singularity"  // local dir with pulled/built Singularity images; override with --singularityDir
  account        = 'ec232'                        // SLURM account/project to bill against; override with --account
  containerPath  = params.singularityDir
}

// ---- SLURM executor configuration ----
executor {
    name      = 'slurm'
    queueSize = 100
}

// Engine enable/autoMounts comes from the `singularity` profile
// (configs/singularity.conf); this block only adds the Fox-specific
// image cache location. Additive merge with singularity.conf, so profile
// order on the command line (singularity,fox vs fox,singularity) doesn`t matter.
singularity {
  cacheDir = params.containerPath
}

process {
  executor = 'slurm'

  // `queue` is Nextflow's built-in directive for SLURM's --partition
  queue  = 'normal'

  // Nextflow`s automatic `--mem` translation from the built-in
  // `memory` process directive (Fox accepts a plain `--mem`, unlike TSD),
  // but that same `memory` directive being set is what broke TSD --
  // Nextflow`s SLURM executor adds native `--mem` unconditionally
  // whenever `memory` is set ANYWHERE in the merged config, on any
  // cluster. Fixing TSD meant moving sizing to `ext.mem_gb`
  // (configs/resources_production.conf / configs/resources_test.conf)
  // instead of the built-in `memory` directive, so Fox now builds its own
  // `--mem` explicitly from `task.ext.mem_gb` too
  clusterOptions = { "--account=${params.account} --mem=${task.ext.mem_gb}G" }

  // Define default container options
  containerOptions = '-B /localscratch'

  errorStrategy = 'retry'
  maxRetries    = 1

  /* NOTE: no default cpus/time/memory directives -- those come from
   * resource-sizing profile - e.g., `production` or `test`
   * Selecting one of the resource-sizing profiles is mandatory
   *    fail fast if neither is present 
   */

  withLabel: leaf_process {
    /* Leaf processes: produce outputs that are not used by downstream processes
     * These processes do not affect the overall pipeline completion -
     *   not critical for pipeline completion.
     * Retry once, then ignore on second failure.
     */
    errorStrategy = { task.attempt == 1 ? 'retry' : 'ignore' }
  }

  withLabel: gpu_process {
    /* Shared settings for GPU-accelerated pbrun tools.
     * `--gpus=1` requests any available GPU type on the `accel` partition
     * `accelerator = 1` is what fq2bam.nf etc. read via
     * task.accelerator.request to build --num-gpus.
     */
    queue            = 'accel'
    clusterOptions   = { "--account=${params.account} --gpus=1 --mem=${task.ext.mem_gb}G" }
    containerOptions = '-B /localscratch --nv'  // --nv exposes GPU/CUDA libs inside the container
    accelerator      = 1
  }

  // ---- vcfqc: label assignment only ----
  // `label` is process identity, not cluster config or workload sizing, but
  // it has to live somewhere always-loaded regardless of profile combo
  withName:VCFQC {
    label  = 'leaf_process'
  }
}
